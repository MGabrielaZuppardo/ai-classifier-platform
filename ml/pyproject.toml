[project]
name = "ai-classifier-ml"
version = "0.1.0"
description = "Pipeline de treino e avaliação (PyTorch), independente da API"
requires-python = ">=3.11"
dependencies = []  # torch/torchvision serão adicionados na Fase 3 (a variante CPU/CUDA depende do ambiente)

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
