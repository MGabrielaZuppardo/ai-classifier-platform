[project]
name = "ai-classifier-ml"
version = "0.1.0"
description = "Pipeline de treino e avaliação (PyTorch), independente da API"
requires-python = ">=3.11"
# torch e torchvision ficam fora de propósito: a variante (CUDA local, CPU no CI) é escolhida
# na instalação. Ver ml/README.md.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
