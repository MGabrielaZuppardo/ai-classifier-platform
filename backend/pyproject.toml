[project]
name = "ai-classifier-backend"
version = "0.1.0"
description = "API FastAPI da plataforma de classificação de imagens"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "authlib>=1.3",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: exige serviços externos (PostgreSQL, Redis)"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
